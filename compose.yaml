services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rentatroka
      MYSQL_USER: rentatroka
      MYSQL_PASSWORD: ${DB_PASSWORD:-rentatroka_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rentatroka_root_local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:

