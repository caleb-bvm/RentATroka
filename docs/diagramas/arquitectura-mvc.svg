<text x="40" y="710" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#df591e">Acceso válido</text>
<text x="40" y="740" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607078">El Servlet crea una sesión nueva y redirige a /inicio.</text>
<text x="40" y="765" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607078">El navegador realiza otra petición; InicioServlet hace forward a la JSP.</text>
<text x="40" y="790" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607078">Si las credenciales fallan, LoginServlet vuelve a login.jsp con el mensaje.</text>
<text x="40" y="830" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#607078">Flecha doble: llamada y respuesta   ·   Línea discontinua: datos o redirección   ·   SQL solo en DAO; HTML solo en JSP</text>
